# Überträgt docs/wiki/ ins GitHub-Wiki, sobald sich die Seiten auf main ändern.
# Englische Seiten liegen oben, deutsche unter de/ (im Wiki zählt nur der Seitenname).
name: Wiki

on:
  push:
    branches: [main]
    paths: ['docs/wiki/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Wiki übertragen
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          rsync -a --delete --exclude .git docs/wiki/ wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Wiki ist aktuell"; exit 0; fi
          git commit -m "Wiki aus docs/wiki übernommen (${GITHUB_SHA::7})"
          git push
