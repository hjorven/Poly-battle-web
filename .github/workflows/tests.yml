# Bei jedem Pull Request und jedem Push auf main: Logik-, Browser- und Datenbank-Tests.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Logiktests
        run: npm test
      - name: Chromium für die Browser-Tests
        run: npx playwright install --with-deps chromium
      - name: Browser-Tests
        run: npm run test:browser

  # Server-Funktionen: alle Migrationen in eine frische Postgres-Datenbank und
  # test/db/online.sql dagegen (scripts/test-db.sh).
  datenbank:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Datenbank-Tests
        env:
          PB_PG: postgresql://postgres@localhost:5432
        run: sh scripts/test-db.sh
