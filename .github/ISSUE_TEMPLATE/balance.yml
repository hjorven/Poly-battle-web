name: Balance
description: Something is too strong, too weak or unfair. · Etwas ist zu stark, zu schwach oder unfair.
title: "Balance: "
labels: ["balance"]
body:
  - type: markdown
    attributes:
      value: |
        The current stats are in the [wiki](https://github.com/hjorven/Poly-battle-web/wiki) (units, tribes, technologies, buildings).

        Die aktuellen Werte stehen im [Wiki](https://github.com/hjorven/Poly-battle-web/wiki/Startseite) (Einheiten, Stämme, Technologien, Gebäude).
  - type: input
    id: was
    attributes:
      label: What is it about? · Was betrifft es?
      placeholder: Knight, Xin-Xi tribe, Roads technology, AI on Hard …
    validations:
      required: true
  - type: dropdown
    id: richtung
    attributes:
      label: Your impression · Dein Eindruck
      options:
        - too strong · zu stark
        - too weak · zu schwach
        - too expensive · zu teuer
        - too cheap · zu billig
        - unfair (start position, AI, map) · unfair (Startplatz, KI, Karte)
    validations:
      required: true
  - type: textarea
    id: begruendung
    attributes:
      label: What makes you think so? · Woran machst du das fest?
      description: How many games, which settings, what happened? · Wie viele Partien, welche Einstellungen, was ist passiert?
      placeholder: In 5 games on Normal, the AI captured two cities with knights by turn 15 every time.
    validations:
      required: true
  - type: textarea
    id: vorschlag
    attributes:
      label: Suggestion · Vorschlag
      placeholder: Raise the knight cost from 8 to 9 stars.
