<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Poly Battle Web</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        header {
            margin-bottom: 15px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            color: #38bdf8;
            margin-bottom: 5px;
        }

        #status-bar {
            font-size: 0.95rem;
            color: #94a3b8;
        }

        #game-container {
            position: relative;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
            background: #1e293b;
            border: 2px solid #334155;
        }

        canvas {
            display: block;
            background-color: #0f172a;
            cursor: pointer;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }

        button {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            transition: background 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.96);
            background-color: #0369a1;
        }
    </style>

    <!-- Supabase CDN einbinden -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header>
        <h1>Poly Battle</h1>
        <div id="status-bar">Verbinde mit Supabase...</div>
    </header>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <div class="controls">
        <button id="endTurnBtn">Zug beenden</button>
    </div>

    <script>
        // Supabase Konfiguration
        const SUPABASE_URL = 'https://dzcikosdbkersscdmppz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6Y2lrb3NkYmtlcnNzY2RtcHB6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNjgyODksImV4cCI6MjEwNjk0NDI4OX0.4WFDB18GkYrhyEpKXqJWRNivM2u2gcfMOYTind7UuQI';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statusBar = document.getElementById('status-bar');

        const GRID_SIZE = 8;
        const TILE_SIZE = 50;

        let gameId = null; // Aktuelle Match-ID
        let gameState = {
            board: [],
            units: [
                { x: 1, y: 1, player: 'player_1', type: 'Krieger', icon: '⚔️' },
                { x: 6, y: 6, player: 'player_2', type: 'Krieger', icon: '🛡️' }
            ]
        };
        let currentTurn = 'player_1';
        let myPlayerRole = 'player_1'; // Zum Testen erst mal Spieler 1
        let selectedUnit = null;

        function initLocalBoard() {
            for (let x = 0; x < GRID_SIZE; x++) {
                gameState.board[x] = [];
                for (let y = 0; y < GRID_SIZE; y++) {
                    gameState.board[x][y] = { terrain: (x + y) % 5 === 0 ? 1 : 0 };
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Kacheln
            for (let x = 0; x < GRID_SIZE; x++) {
                for (let y = 0; y < GRID_SIZE; y++) {
                    const px = x * TILE_SIZE;
                    const py = y * TILE_SIZE;

                    ctx.fillStyle = gameState.board[x][y].terrain === 1 ? '#0369a1' : '#15803d';
                    ctx.fillRect(px, py, TILE_SIZE - 2, TILE_SIZE - 2);

                    if (selectedUnit && selectedUnit.x === x && selectedUnit.y === y) {
                        ctx.strokeStyle = '#facc15';
                        ctx.lineWidth = 3;
                        ctx.strokeRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                    }
                }
            }

            // 2. Einheiten
            gameState.units.forEach(unit => {
                const px = unit.x * TILE_SIZE;
                const py = unit.y * TILE_SIZE;

                ctx.fillStyle = unit.player === 'player_1' ? '#3b82f6' : '#ef4444';
                ctx.beginPath();
                ctx.arc(px + TILE_SIZE / 2, py + TILE_SIZE / 2, TILE_SIZE / 2.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.font = '24px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(unit.icon, px + TILE_SIZE / 2, py + TILE_SIZE / 2);
            });
        }

        // Spiel in Supabase laden oder neues erstellen
        async function setupGame() {
            initLocalBoard();

            // Versuche das letzte offene Spiel zu finden
            let { data: matches, error } = await _supabase
                .from('matches')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(1);

            if (matches && matches.length > 0) {
                // Spiel existiert bereits, laden
                const activeMatch = matches[0];
                gameId = activeMatch.id;
                gameState = activeMatch.game_state;
                currentTurn = activeMatch.current_turn;
                statusBar.textContent = `Spiel geladen. Am Zug: ${currentTurn}`;
            } else {
                // Neues Spiel in Supabase anlegen
                const { data, error: insertError } = await _supabase
                    .from('matches')
                    .insert([{
                        game_state: gameState,
                        current_turn: 'player_1',
                        player_1: 'Aktiv'
                    }])
                    .select();

                if (!insertError && data) {
                    gameId = data[0].id;
                    statusBar.textContent = `Neues Spiel erstellt. Du bist Spieler 1.`;
                } else {
                    statusBar.textContent = `Fehler beim Erstellen des Spiels.`;
                    console.error(insertError);
                }
            }

            draw();
            listenToRealtimeChanges();
        }

        // Echtzeit-Lauscher für Supabase
        function listenToRealtimeChanges() {
            _supabase
                .channel('public:matches')
                .on('postgres_changes', {
                    event: 'UPDATE',
                    schema: 'public',
                    table: 'matches',
                    filter: `id=eq.${gameId}`
                }, payload => {
                    console.log('Update vom Gegner erhalten!', payload.new);
                    gameState = payload.new.game_state;
                    currentTurn = payload.new.current_turn;
                    statusBar.textContent = `Gegner hat gezogen! Am Zug: ${currentTurn}`;
                    selectedUnit = null;
                    draw();
                })
                .subscribe();
        }

        // Zug in Supabase speichern
        async function syncGameState() {
            const nextTurn = currentTurn === 'player_1' ? 'player_2' : 'player_1';

            const { error } = await _supabase
                .from('matches')
                .update({
                    game_state: gameState,
                    current_turn: nextTurn,
                    last_move_at: new Date().toISOString()
                })
                .eq('id', gameId);

            if (error) {
                console.error('Fehler beim Speichern:', error);
                statusBar.textContent = 'Fehler beim Synchronisieren!';
            } else {
                currentTurn = nextTurn;
                statusBar.textContent = `Zug beendet. Warten auf Gegner... (Am Zug: ${currentTurn})`;
                selectedUnit = null;
                draw();
            }
        }

        // Klick / Touch auf das Canvas
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = Math.floor((e.clientX - rect.left) / TILE_SIZE);
            const clickY = Math.floor((e.clientY - rect.top) / TILE_SIZE);

            if (clickX < 0 || clickX >= GRID_SIZE || clickY < 0 || clickY >= GRID_SIZE) return;

            const clickedUnit = gameState.units.find(u => u.x === clickX && u.y === clickY);

            if (clickedUnit) {
                if (clickedUnit.player === currentTurn) {
                    selectedUnit = clickedUnit;
                    statusBar.themes = `${selectedUnit.type} ausgewählt. Wohin bewegen?`;
                    draw();
                }
            } else if (selectedUnit) {
                const dx = Math.abs(selectedUnit.x - clickX);
                const dy = Math.abs(selectedUnit.y - clickY);

                if (dx + dy === 1) {
                    selectedUnit.x = clickX;
                    selectedUnit.y = clickY;
                    draw();
                } else {
                    selectedUnit = null;
                    draw();
                }
            }
        });

        document.getElementById('endTurnBtn').addEventListener('click', () => {
            syncGameState();
        });

        // Start beim Laden der Seite
        setupGame();
    </script>
</body>
</html>
