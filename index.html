<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Poly Battle</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #fafafa;
            color: #18181b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            color: #09090b;
            margin-bottom: 4px;
        }

        #status-bar {
            font-size: 0.875rem;
            color: #71717a;
        }

        #game-container {
            position: relative;
            background: #ffffff;
            border: 1px solid #e4e4e7;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        canvas {
            display: block;
            cursor: pointer;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 12px;
        }

        button {
            background-color: #18181b;
            color: #ffffff;
            border: 1px solid #18181b;
            padding: 10px 20px;
            font-size: 0.875rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        button:hover {
            background-color: #27272a;
        }

        button:active {
            background-color: #3f3f46;
        }
    </style>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header>
        <h1>Poly Battle</h1>
        <div id="status-bar">Verbinde mit Supabase...</div>
    </header>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <div class="controls">
        <button id="endTurnBtn">Zug beenden</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://dzcikosdbkersscdmppz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6Y2lrb3NkYmtlcnNzY2RtcHB6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNjgyODksImV4cCI6MjEwNjk0NDI4OX0.4WFDB18GkYrhyEpKXqJWRNivM2u2gcfMOYTind7UuQI';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statusBar = document.getElementById('status-bar');

        const GRID_SIZE = 8;
        const TILE_SIZE = 50;

        let gameId = null;
        let gameState = {
            board: [],
            units: [
                { x: 1, y: 1, player: 'player_1', type: 'Krieger', icon: '⚔️' },
                { x: 6, y: 6, player: 'player_2', type: 'Krieger', icon: '🛡️' }
            ]
        };
        let currentTurn = 'player_1';
        let selectedUnit = null;

        function initLocalBoard() {
            for (let x = 0; x < GRID_SIZE; x++) {
                gameState.board[x] = [];
                for (let y = 0; y < GRID_SIZE; y++) {
                    gameState.board[x][y] = { terrain: (x + y) % 5 === 0 ? 1 : 0 };
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let x = 0; x < GRID_SIZE; x++) {
                for (let y = 0; y < GRID_SIZE; y++) {
                    const px = x * TILE_SIZE;
                    const py = y * TILE_SIZE;

                    ctx.fillStyle = gameState.board[x][y].terrain === 1 ? '#e0f2fe' : '#f4f4f5';
                    ctx.fillRect(px, py, TILE_SIZE - 1, TILE_SIZE - 1);

                    if (selectedUnit && selectedUnit.x === x && selectedUnit.y === y) {
                        ctx.strokeStyle = '#18181b';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(px + 1, py + 1, TILE_SIZE - 3, TILE_SIZE - 3);
                    }
                }
            }

            gameState.units.forEach(unit => {
                const px = unit.x * TILE_SIZE;
                const py = unit.y * TILE_SIZE;

                ctx.fillStyle = unit.player === 'player_1' ? '#2563eb' : '#dc2626';
                ctx.beginPath();
                ctx.arc(px + TILE_SIZE / 2, py + TILE_SIZE / 2, TILE_SIZE / 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.font = '20px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(unit.icon, px + TILE_SIZE / 2, py + TILE_SIZE / 2);
            });
        }

        async function setupGame() {
            initLocalBoard();

            // Prüfen, ob es ein aktives Spiel gibt
            let { data: matches, error } = await _supabase
                .from('matches')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(1);

            if (error) {
                console.error('Fehler beim Laden:', error);
            }

            if (matches && matches.length > 0) {
                const activeMatch = matches[0];
                gameId = activeMatch.id;
                gameState = activeMatch.game_state;
                currentTurn = activeMatch.current_turn;
                statusBar.textContent = `Spiel geladen. Am Zug: ${currentTurn}`;
            } else {
                // Neues Spiel anlegen, falls keins existiert
                const { data, error: insertError } = await _supabase
                    .from('matches')
                    .insert([{
                        game_state: gameState,
                        current_turn: 'player_1',
                        player_1: 'Aktiv'
                    }])
                    .select();

                if (insertError) {
                    statusBar.textContent = `Fehler beim Erstellen des Spiels.`;
                    console.error('Supabase Insert Error:', insertError);
                } else if (data && data.length > 0) {
                    gameId = data[0].id;
                    statusBar.textContent = `Neues Spiel erstellt.`;
                }
            }

            draw();
            listenToRealtimeChanges();
        }

        function listenToRealtimeChanges() {
            if (!gameId) return;
            _supabase
                .channel('public:matches')
                .on('postgres_changes', {
                    event: 'UPDATE',
                    schema: 'public',
                    table: 'matches',
                    filter: `id=eq.${gameId}`
                }, payload => {
                    gameState = payload.new.game_state;
                    currentTurn = payload.new.current_turn;
                    statusBar.textContent = `Zug erhalten. Am Zug: ${currentTurn}`;
                    selectedUnit = null;
                    draw();
                })
                .subscribe();
        }

        async function syncGameState() {
            if (!gameId) return;
            const nextTurn = currentTurn === 'player_1' ? 'player_2' : 'player_1';

            const { error } = await _supabase
                .from('matches')
                .update({
                    game_state: gameState,
                    current_turn: nextTurn,
                    last_move_at: new Date().toISOString()
                })
                .eq('id', gameId);

            if (error) {
                statusBar.textContent = 'Fehler beim Synchronisieren.';
                console.error(error);
            } else {
                currentTurn = nextTurn;
                statusBar.textContent = `Warte auf Gegner...`;
                selectedUnit = null;
                draw();
            }
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = Math.floor((e.clientX - rect.left) / TILE_SIZE);
            const clickY = Math.floor((e.clientY - rect.top) / TILE_SIZE);

            if (clickX < 0 || clickX >= GRID_SIZE || clickY < 0 || clickY >= GRID_SIZE) return;

            const clickedUnit = gameState.units.find(u => u.x === clickX && u.y === clickY);

            if (clickedUnit) {
                if (clickedUnit.player === currentTurn) {
                    selectedUnit = clickedUnit;
                    statusBar.textContent = `${selectedUnit.type} ausgewählt.`;
                    draw();
                }
            } else if (selectedUnit) {
                const dx = Math.abs(selectedUnit.x - clickX);
                const dy = Math.abs(selectedUnit.y - clickY);

                if (dx + dy === 1) {
                    selectedUnit.x = clickX;
                    selectedUnit.y = clickY;
                    draw();
                } else {
                    selectedUnit = null;
                    draw();
                }
            }
        });

        document.getElementById('endTurnBtn').addEventListener('click', () => {
            syncGameState();
        });

        setupGame();
    </script>
</body>
</html>
